# Cluster on-prem — đang hoạt động. ApplicationSet `cluster-roots` đọc file này.
#
# Các trường trong `platform:` chỉ là metadata mô tả, ApplicationSet không
# render gì từ chúng. Nhưng metadata sai còn tệ hơn không có metadata, nên
# giữ nó khớp với thực tế.
cluster:
  name: bc2-onprem
  server: https://kubernetes.default.svc
  rootPath: platform/argocd/apps

platform:
  provider: bare-metal
  ingressClass: none           # không có ingress controller; expose bằng NodePort
  storageClass: local-path     # node-local, PV có nodeAffinity
  exposure: nodeport           # chỉ truy cập được trong tailnet
  cni: cilium                  # kubeProxyReplacement — xem K8sSecDaP-infra, role cni_cilium

workloads:
  overlay: onprem
