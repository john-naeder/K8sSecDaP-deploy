# =============================================================================
# HELMFILE — bootstrap tối thiểu để Argo CD quản lý phần còn lại.
# =============================================================================
#
# Chạy:
#   helmfile -f helmfile-bootstrap.yaml diff    # xem trước
#   helmfile -f helmfile-bootstrap.yaml apply   # idempotent
#
# Chỉ còn MỘT release. cert-manager, traefik và sealed-secrets đã bỏ cùng
# với stack SOC: cluster chỉ truy cập được qua tailnet, service expose bằng
# NodePort, nên không có ingress controller thì cũng không có gì để cấp cert.
#
# Sau bootstrap:
#   kubectl apply -f ../argocd/app-of-apps.yaml
# Từ đó trở đi Argo CD tự cài storage -> GitLab -> GitLab Runner theo sync-wave.
#
# Yêu cầu:
#   - Cluster đã lên và Cilium Ready (xem infra/ansible, role cni_cilium)
#   - helm + helmfile + plugin helm-diff
# =============================================================================

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600
  cleanupOnFail: true
  createNamespace: true

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: "7.8.7"
    values:
      - values/argocd.yaml
