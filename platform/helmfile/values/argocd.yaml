# Argo CD — cluster 2-3 node, RAM là ràng buộc chính.
# server.insecure=true vì không còn ingress controller terminate TLS;
# truy cập qua `kubectl port-forward` hoặc NodePort trên tailnet.
global:
  domain: argocd.zt.local
configs:
  params:
    server.insecure: "true"
  cm:
    application.resourceTrackingMethod: annotation
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }
server:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }
repoServer:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }
applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 256Mi }
notifications:
  enabled: false
dex:
  enabled: false
redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 128Mi }
