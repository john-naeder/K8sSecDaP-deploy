# =============================================================================
# Hai Service, hai vai trò khác nhau:
#   gitlab           — ClusterIP, headless-adjacent, cho traffic trong cluster
#   gitlab-nodeport  — NodePort, cho người dùng và git client trên tailnet
#
# NodePort nghe trên MỌI node nhờ Cilium kubeProxyReplacement, kể cả node
# không chạy pod GitLab. Nên http://100.80.0.1:30080 vẫn đúng
# sau khi pod chuyển node.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: ClusterIP
  selector:
    app: gitlab
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: ssh,  port: 22, targetPort: ssh }
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-nodeport
  namespace: gitlab
spec:
  type: NodePort
  # Chỉ node ĐANG chạy pod mới phục vụ NodePort này.
  #
  # Với "Cluster" (mặc định), mọi node đều mở cổng và node không có pod sẽ
  # forward sang node có pod. Đường forward đó HỎNG khi gói đi vào bằng
  # tailscale0: kết nối treo im lặng, SYN retransmit tới hết giờ, và Cilium
  # không ghi drop nào. tailscale0 là thiết bị L3 (link/none, tun) nên không
  # có header L2 để redirect sang node khác.
  #
  # Đo được, đảo backend thì lỗi đảo theo — không phải node nào xấu:
  #   coredns (backend ở master):   master 5/5, worker-1 0/5, worker-2 0/5
  #   gitlab  (backend ở worker-1): worker-1 5/5, master 0/5, worker-2 0/5
  #
  # "Local" biến trường hợp chạy được thành trường hợp DUY NHẤT: node không có
  # pod sẽ từ chối ngay thay vì treo, và source IP của client được giữ nguyên.
  # gitlab-0 bị ghim vào worker-1 bởi PV local-path nên địa chỉ này ổn định.
  externalTrafficPolicy: Local
  selector:
    app: gitlab
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30080 }
    - { name: ssh,  port: 22, targetPort: ssh,  nodePort: 30022 }
