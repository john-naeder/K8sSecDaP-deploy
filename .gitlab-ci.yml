include:
  - project: 'john-naeder/ci-templates'
    ref: main
    file: '/security.gitlab-ci.yml'
  # Until that project exists on your GitLab, vendor the file instead:
  #   - local: '.gitlab/ci/security.yml'

stages:
  - scan
  - report

variables:
  # Kubernetes manifests, Helmfile and Argo CD Applications — iac:trivy is the
  # job that matters. Findings here are the ones that reach a running cluster.
  SECURITY_FAIL_ON: ''
